[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "elevendash"
version = "0.1.0"
description = "Match analysis and a shareable dashboard from Eleven Table Tennis (Quest) game logs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "glki6" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["eleven table tennis", "table tennis", "ping pong", "meta quest", "vr", "match analysis", "dashboard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/glki6/elevendash"
Issues = "https://github.com/glki6/elevendash/issues"

[project.optional-dependencies]
# Uploading session recordings and highlight reels to YouTube (youtube/), also needs ffmpeg on PATH
youtube = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.0",
    "numpy>=1.24",
]

[project.scripts]
elevendash = "elevendash.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elevendash = ["web/*"]
